<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a27"><meta name="description" content="Note a pay — บันทึกรายรับรายจ่ายอย่างง่าย">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<title>Note a pay</title>
<style>
:root{--bg:#f3f7f6;--card:#fff;--ink:#172a28;--muted:#71817e;--line:#e4ece9;--green:#13a982;--green2:#dff7ee;--red:#e96579;--red2:#fff0f2;--nav:#fff;--shadow:0 8px 28px #153b3010}
[data-theme=dark]{--bg:#101a20;--card:#1b2931;--ink:#f2f7f5;--muted:#a3b3b0;--line:#304149;--green:#43d6aa;--green2:#183d35;--red:#ff8294;--red2:#442831;--nav:#1b2931;--shadow:none}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;padding-bottom:90px}button,input,select{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:680px;margin:auto;padding:18px 16px 24px}.top{display:flex;justify-content:space-between;align-items:center;margin:8px 0 18px}.brand{font-size:25px;font-weight:850;letter-spacing:-.6px}.brand span{color:var(--green)}.sub{color:var(--muted);font-size:13px}.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--card);color:var(--ink);font-size:19px;box-shadow:var(--shadow)}.month{display:flex;align-items:center;justify-content:center;gap:22px;margin:12px 0 15px}.month button{background:transparent;color:var(--ink);font-size:25px}.month strong{font-size:15px;min-width:105px;text-align:center}.hero{background:linear-gradient(135deg,#143c36,#176c58);border-radius:25px;padding:22px;color:#fff;box-shadow:0 12px 30px #0b4b3b25}.hero .sub{color:#c5e7dc}.balance{font-size:34px;font-weight:850;margin:3px 0 18px;letter-spacing:-1px}.twos{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{background:#ffffff16;border:1px solid #ffffff20;border-radius:16px;padding:12px}.mini small{color:#c5e7dc}.mini b{display:block;font-size:17px;margin-top:3px}.positive{color:var(--green)}.negative{color:var(--red)}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:23px 2px 10px}.sectionhead h2{font-size:18px;margin:0}.link{background:none;color:var(--green);font-weight:700}.list{display:grid;gap:9px}.item{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:12px;display:flex;align-items:center;gap:11px;box-shadow:var(--shadow)}.bubble{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--green2);font-size:19px}.bubble.out{background:var(--red2)}.details{min-width:0;flex:1}.details b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.details small{color:var(--muted);font-size:12px}.amount{font-weight:800;white-space:nowrap}.delete{background:none;color:var(--muted);font-size:17px;padding:6px}.empty{text-align:center;color:var(--muted);padding:34px 12px;background:var(--card);border:1px dashed var(--line);border-radius:18px}.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:var(--nav);border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:6px}.nav button{background:none;color:var(--muted);font-size:11px;min-width:65px;padding:5px 10px;border-radius:13px}.nav button span{display:block;font-size:20px;margin-bottom:2px}.nav button.active{background:var(--green2);color:var(--green);font-weight:800}.fab{position:fixed;right:max(20px,calc((100vw - 640px)/2));bottom:85px;width:58px;height:58px;border-radius:20px;background:var(--green);color:#062b22;font-size:30px;box-shadow:0 8px 24px #0b795a45}.panel{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:16px;margin:12px 0}.panel h3{margin:0 0 13px;font-size:16px}.barrow{margin:12px 0}.barlabel{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.track{height:9px;background:var(--line);border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--green);border-radius:20px}.field{display:grid;gap:6px;margin:11px 0}.field label{font-size:13px;color:var(--muted);font-weight:650}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;background:var(--bg);color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:var(--green)}.primary{background:var(--green);color:#062b22;font-weight:800;border-radius:13px;padding:13px 16px;width:100%;margin-top:8px}.secondary{background:var(--green2);color:var(--green);font-weight:750;border-radius:12px;padding:10px 12px}.seg{display:flex;background:var(--bg);padding:4px;border-radius:13px;gap:4px}.seg button{flex:1;border-radius:10px;padding:9px;background:transparent;color:var(--muted);font-weight:700}.seg button.sel{background:var(--green);color:#062b22}.modal{position:fixed;inset:0;background:#0009;z-index:10;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{background:var(--card);color:var(--ink);width:min(100%,680px);border-radius:25px 25px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}.sheethead{display:flex;justify-content:space-between;align-items:center}.sheethead h2{margin:0;font-size:20px}.close{background:var(--bg);color:var(--ink);border-radius:10px;width:34px;height:34px}.hint{color:var(--muted);font-size:12px;line-height:1.5}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--bg);border-radius:15px;padding:13px}.stat small{color:var(--muted)}.stat b{display:block;font-size:18px;margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:120px}.hidden{display:none!important}
</style></head>
<body>
<div class="wrap">
<header class="top"><div><div class="brand">Note <span>a pay</span></div><div class="sub">จัดการเงินให้ง่ายขึ้นทุกวัน ✨</div></div><button class="iconbtn" id="themeBtn" aria-label="เปลี่ยนธีม">☾</button></header>
<main id="app"></main>
</div>
<button class="fab" id="fab" aria-label="เพิ่มรายการ">＋</button>
<nav class="nav"><button data-tab="home" class="active"><span>⌂</span>ภาพรวม</button><button data-tab="list"><span>▤</span>รายการ</button><button data-tab="stats"><span>◔</span>วิเคราะห์</button><button data-tab="settings"><span>⚙</span>ตั้งค่า</button></nav>
<div class="modal" id="modal"><div class="sheet"><div class="sheethead"><h2 id="modalTitle">เพิ่มรายการ</h2><button class="close" id="close">✕</button></div><form id="entryForm">
<div class="field"><label>ประเภท</label><div class="seg"><button type="button" class="sel" data-kind="expense">รายจ่าย</button><button type="button" data-kind="income">รายรับ</button></div></div>
<div class="field"><label>จำนวนเงิน (บาท)</label><input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required></div>
<div class="field"><label>รายละเอียด</label><input id="note" maxlength="80" placeholder="เช่น ข้าวกลางวัน"></div>
<div class="field"><label>หมวดหมู่</label><select id="category"></select></div>
<div class="field"><label>วันที่</label><input id="date" type="date" required></div>
<button class="primary" type="submit">บันทึกรายการ</button></form></div></div>
<script>
const $=s=>document.querySelector(s), money=n=>'฿'+Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2});
const expenseCats=['อาหาร','เดินทาง','ช้อปปิ้ง','บิล/ค่าน้ำไฟ','สุขภาพ','บ้าน','การศึกษา','บันเทิง','อื่นๆ'];
const incomeCats=['เงินเดือน','งานเสริม','ลงทุน','ของขวัญ','ขายของ','อื่นๆ'];
const emojis={'อาหาร':'🍜','เดินทาง':'🚗','ช้อปปิ้ง':'🛍️','บิล/ค่าน้ำไฟ':'💡','สุขภาพ':'💊','บ้าน':'🏠','การศึกษา':'📚','บันเทิง':'🎮','อื่นๆ':'📌','เงินเดือน':'💼','งานเสริม':'💻','ลงทุน':'📈','ของขวัญ':'🎁','ขายของ':'🛒'};
let data=JSON.parse(localStorage.getItem('nap_entries')||'[]'), tab='home', month=new Date().toISOString().slice(0,7), kind='expense', theme=localStorage.getItem('nap_theme')||'light', budget=Number(localStorage.getItem('nap_budget')||0);
document.documentElement.dataset.theme=theme;
function save(){localStorage.setItem('nap_entries',JSON.stringify(data))}
function fmtMonth(m){let [y,mo]=m.split('-').map(Number);return new Intl.DateTimeFormat('th-TH',{month:'long',year:'numeric'}).format(new Date(y,mo-1,1))}
function shiftMonth(d){let [y,m]=month.split('-').map(Number),dt=new Date(y,m-1+d,1);month=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');render()}
function monthData(){return data.filter(x=>x.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id)}
function totals(){let a=monthData(),inc=a.filter(x=>x.kind==='income').reduce((s,x)=>s+x.amount,0),out=a.filter(x=>x.kind==='expense').reduce((s,x)=>s+x.amount,0);return{inc,out,bal:inc-out}}
function monthPicker(){return `<div class="month"><button onclick="shiftMonth(-1)">‹</button><strong>${fmtMonth(month)}</strong><button onclick="shiftMonth(1)">›</button></div>`}
function entryHTML(x){return `<div class="item"><div class="bubble ${x.kind==='expense'?'out':''}">${emojis[x.cat]||'📌'}</div><div class="details"><b>${esc(x.note||x.cat)}</b><small>${esc(x.cat)} · ${x.date.split('-').reverse().join('/')}</small></div><div class="amount ${x.kind==='income'?'positive':'negative'}">${x.kind==='income'?'+':'−'}${money(x.amount)}</div><button class="delete" onclick="removeEntry(${x.id})" aria-label="ลบรายการ">✕</button></div>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let app=$('#app'),a=monthData(),t=totals();
if(tab==='home'){app.innerHTML=`${monthPicker()}<section class="hero"><div class="sub">เงินคงเหลือของเดือนนี้</div><div class="balance">${money(t.bal)}</div><div class="twos"><div class="mini"><small>↗ รายรับ</small><b>${money(t.inc)}</b></div><div class="mini"><small>↘ รายจ่าย</small><b>${money(t.out)}</b></div></div></section><div class="sectionhead"><h2>รายการล่าสุด</h2><button class="link" onclick="setTab('list')">ดูทั้งหมด →</button></div><div class="list">${a.length?a.slice(0,6).map(entryHTML).join(''):'<div class="empty">ยังไม่มีรายการในเดือนนี้<br>กดปุ่ม ＋ เพื่อเริ่มบันทึก</div>'}</div>`}
if(tab==='list'){app.innerHTML=`<div class="sectionhead"><h2>รายการทั้งหมด</h2><span class="sub">${a.length} รายการ</span></div>${monthPicker()}<div class="list">${a.length?a.map(entryHTML).join(''):'<div class="empty">ยังไม่มีรายการในเดือนนี้</div>'}</div>`}
if(tab==='stats'){let groups={};a.filter(x=>x.kind==='expense').forEach(x=>groups[x.cat]=(groups[x.cat]||0)+x.amount);let rows=Object.entries(groups).sort((x,y)=>y[1]-x[1]);app.innerHTML=`<div class="sectionhead"><h2>วิเคราะห์การเงิน</h2></div>${monthPicker()}<div class="statgrid"><div class="stat"><small>รายรับ</small><b class="positive">${money(t.inc)}</b></div><div class="stat"><small>รายจ่าย</small><b class="negative">${money(t.out)}</b></div><div class="stat"><small>คงเหลือ</small><b>${money(t.bal)}</b></div><div class="stat"><small>จำนวนรายการ</small><b>${a.length}</b></div></div><div class="panel"><h3>รายจ่ายแยกตามหมวดหมู่</h3>${rows.length?rows.map(([k,v])=>`<div class="barrow"><div class="barlabel"><span>${emojis[k]||'📌'} ${esc(k)}</span><b>${money(v)} · ${t.out?Math.round(v/t.out*100):0}%</b></div><div class="track"><div class="fill" style="width:${t.out?v/t.out*100:0}%"></div></div></div>`).join(''):'<div class="empty">ยังไม่มีรายจ่ายให้วิเคราะห์</div>'}</div><div class="panel"><h3>งบประมาณรายเดือน</h3><div class="barlabel"><span>ใช้ไป ${money(t.out)}</span><b>${budget?money(budget):'ยังไม่ตั้งงบ'}</b></div><div class="track"><div class="fill" style="width:${budget?Math.min(100,t.out/budget*100):0}%;background:${budget&&t.out>budget?'var(--red)':'var(--green)'}"></div></div></div>`}
if(tab==='settings'){app.innerHTML=`<div class="sectionhead"><h2>ตั้งค่า</h2></div><div class="panel"><h3>รูปลักษณ์</h3><div class="actions"><button class="secondary" onclick="setTheme('light')">☀️ สว่าง</button><button class="secondary" onclick="setTheme('dark')">🌙 มืด</button></div></div><div class="panel"><h3>งบประมาณรายเดือน</h3><div class="field"><label>วงเงินรายจ่าย (บาท)</label><input id="budgetInput" type="number" min="0" step="1" value="${budget||''}" placeholder="เช่น 12000"></div><button class="primary" onclick="saveBudget()">บันทึกงบประมาณ</button></div><div class="panel"><h3>สำรองและกู้คืนข้อมูล</h3><p class="hint">ข้อมูลถูกเก็บในพื้นที่ส่วนตัวของเบราว์เซอร์บนเครื่องนี้ การล้างข้อมูลเบราว์เซอร์หรือเปลี่ยนเครื่องอาจทำให้ข้อมูลหาย ควรส่งออกสำรองเป็นระยะ</p><div class="actions"><button class="secondary" onclick="exportJSON()">ส่งออกข้อมูล</button><button class="secondary" onclick="$('#importFile').click()">นำเข้าข้อมูล</button><input id="importFile" type="file" accept="application/json" class="hidden" onchange="importJSON(event)"></div><div style="height:10px"></div><button class="secondary" onclick="exportCSV()" style="width:100%">ส่งออกรายงาน CSV</button></div><div class="panel"><h3>เกี่ยวกับ Note a pay</h3><p class="hint">เวอร์ชัน 1.1 · ออกแบบให้ใช้งานง่ายบนมือถือ · รองรับภาษาไทยและเงินบาท</p></div>`}
document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#fab').classList.toggle('hidden',tab==='settings'||tab==='stats')}
function setTab(t){tab=t;render()}
function setTheme(t){theme=t;document.documentElement.dataset.theme=t;localStorage.setItem('nap_theme',t);$('#themeBtn').textContent=t==='dark'?'☀':'☾';render()}
function removeEntry(id){if(confirm('ลบรายการนี้ใช่ไหม?')){data=data.filter(x=>x.id!==id);save();render()}}
function openModal(){kind='expense';$('#entryForm').reset();$('#date').value=new Date().toISOString().slice(0,10);setKind('expense');$('#modal').classList.add('show')}
function setKind(k){kind=k;document.querySelectorAll('[data-kind]').forEach(b=>b.classList.toggle('sel',b.dataset.kind===k));$('#category').innerHTML=(k==='income'?incomeCats:expenseCats).map(c=>`<option>${c}</option>`).join('')}
function saveBudget(){budget=Math.max(0,Number($('#budgetInput').value)||0);localStorage.setItem('nap_budget',budget);render();alert('บันทึกงบประมาณแล้ว')}
function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function exportJSON(){download('note-a-pay-backup.json',JSON.stringify({version:1,entries:data,budget},null,2),'application/json')}
function exportCSV(){let rows=[['date','type','category','note','amount'],...data.map(x=>[x.date,x.kind,x.cat,x.note,x.amount])];download('note-a-pay.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv;charset=utf-8')}
function importJSON(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result),arr=Array.isArray(o)?o:o.entries;if(!Array.isArray(arr)||!arr.every(x=>x&&Number.isFinite(Number(x.amount))&&['income','expense'].includes(x.kind)&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)))throw Error();if(confirm('นำเข้าข้อมูล '+arr.length+' รายการ? ข้อมูลปัจจุบันจะถูกแทนที่')){data=arr.map(x=>({...x,amount:Number(x.amount)}));budget=Number(o.budget)||budget;save();localStorage.setItem('nap_budget',budget);render();alert('นำเข้าข้อมูลสำเร็จ')}}catch(_){alert('ไฟล์ไม่ถูกต้องหรือไม่ใช่ไฟล์สำรอง Note a pay')} };r.readAsText(f);e.target.value=''}
$('#entryForm').addEventListener('submit',e=>{e.preventDefault();let amount=Number($('#amount').value),date=$('#date').value;if(!(amount>0)||!date)return;data.push({id:Date.now(),amount,note:$('#note').value.trim(),cat:$('#category').value,kind,date});save();$('#modal').classList.remove('show');render()});
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
$('#fab').onclick=openModal;$('#close').onclick=()=>$('#modal').classList.remove('show');$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')});
document.querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('click',()=>setKind(b.dataset.kind)));
$('#themeBtn').onclick=()=>setTheme(theme==='dark'?'light':'dark');
$('#themeBtn').textContent=theme==='dark'?'☀':'☾';render();
if('serviceWorker'in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>

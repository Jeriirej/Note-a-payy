<!doctype html>
<html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a27"><meta name="description" content="Note a pay — จัดการรายรับ รายจ่าย เงินออม และหนี้สิน">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>Note a pay</title>
<style>
:root{--bg:#f3f7f6;--card:#fff;--ink:#172a28;--muted:#71817e;--line:#e4ece9;--green:#13a982;--green2:#dff7ee;--red:#e96579;--red2:#fff0f2;--nav:#fff;--shadow:0 8px 28px #153b3010}
[data-theme=dark]{--bg:#101a20;--card:#1b2931;--ink:#f2f7f5;--muted:#a3b3b0;--line:#304149;--green:#43d6aa;--green2:#183d35;--red:#ff8294;--red2:#442831;--nav:#1b2931;--shadow:none}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;padding-bottom:94px}button,input,select{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:720px;margin:auto;padding:16px 14px 24px}.top{display:flex;justify-content:space-between;align-items:center;margin:8px 0 16px}.brand{font-size:25px;font-weight:850;letter-spacing:-.6px}.brand span{color:var(--green)}.sub,.hint{color:var(--muted);font-size:12px;line-height:1.5}.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--card);color:var(--ink);font-size:19px;box-shadow:var(--shadow)}.month{display:flex;align-items:center;justify-content:center;gap:22px;margin:12px 0 15px}.month button{background:transparent;color:var(--ink);font-size:25px}.month strong{font-size:15px;min-width:105px;text-align:center}.hero{background:linear-gradient(135deg,#143c36,#176c58);border-radius:25px;padding:21px;color:#fff;box-shadow:0 12px 30px #0b4b3b25}.hero .sub{color:#c5e7dc}.balance{font-size:34px;font-weight:850;margin:3px 0 18px;letter-spacing:-1px}.twos,.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{background:#ffffff16;border:1px solid #ffffff20;border-radius:16px;padding:12px}.mini small{color:#c5e7dc}.mini b{display:block;font-size:17px;margin-top:3px}.positive{color:var(--green)}.negative{color:var(--red)}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}.sectionhead h2{font-size:18px;margin:0}.link{background:none;color:var(--green);font-weight:700}.list{display:grid;gap:9px}.item{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:11px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}.bubble{width:42px;height:42px;flex-shrink:0;border-radius:14px;display:grid;place-items:center;background:var(--green2);font-size:19px}.bubble.out{background:var(--red2)}.details{min-width:0;flex:1}.details b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.details small{color:var(--muted);font-size:12px}.amount{font-weight:800;white-space:nowrap;font-size:14px}.delete{background:none;color:var(--muted);font-size:16px;padding:5px}.empty{text-align:center;color:var(--muted);padding:28px 12px;background:var(--card);border:1px dashed var(--line);border-radius:18px}.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:var(--nav);border-top:1px solid var(--line);padding:6px 4px calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;gap:2px;overflow-x:auto}.nav button{background:none;color:var(--muted);font-size:10px;min-width:0;flex:1;padding:5px 2px;border-radius:12px;white-space:nowrap}.nav button span{display:block;font-size:19px;margin-bottom:2px}.nav button.active{background:var(--green2);color:var(--green);font-weight:800}.fab{position:fixed;z-index:4;right:max(18px,calc((100vw - 680px)/2));bottom:87px;width:56px;height:56px;border-radius:19px;background:var(--green);color:#062b22;font-size:30px;box-shadow:0 8px 24px #0b795a45}.panel,.goalcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:11px 0;box-shadow:var(--shadow)}.panel h3{margin:0 0 12px;font-size:16px}.barrow{margin:12px 0}.barlabel{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:6px}.track{height:9px;background:var(--line);border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--green);border-radius:20px}.field{display:grid;gap:6px;margin:11px 0}.field label{font-size:13px;color:var(--muted);font-weight:650}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;background:var(--bg);color:var(--ink);outline:none}.primary{background:var(--green);color:#062b22;font-weight:800;border-radius:13px;padding:13px 16px;width:100%;margin-top:8px}.secondary{background:var(--green2);color:var(--green);font-weight:750;border-radius:12px;padding:10px 12px}.danger{background:var(--red2);color:var(--red);font-weight:750;border-radius:12px;padding:9px 11px}.seg{display:flex;background:var(--bg);padding:4px;border-radius:13px;gap:4px}.seg button{flex:1;border-radius:10px;padding:9px;background:transparent;color:var(--muted);font-weight:700}.seg button.sel{background:var(--green);color:#062b22}.modal{position:fixed;inset:0;background:#0009;z-index:10;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{background:var(--card);color:var(--ink);width:min(100%,680px);border-radius:25px 25px 0 0;padding:18px 17px calc(20px + env(safe-area-inset-bottom));max-height:93vh;overflow:auto}.sheethead{display:flex;justify-content:space-between;align-items:center}.sheethead h2{margin:0;font-size:20px}.close{background:var(--bg);color:var(--ink);border-radius:10px;width:34px;height:34px}.stat{background:var(--bg);border-radius:15px;padding:12px}.stat small{color:var(--muted)}.stat b{display:block;font-size:17px;margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:110px}.hidden{display:none!important}.photo{width:100%;max-height:180px;object-fit:cover;border-radius:13px;margin-top:8px}.thumb{width:48px;height:48px;object-fit:cover;border-radius:12px;flex-shrink:0}.goalimg{width:100%;height:125px;object-fit:cover;border-radius:13px;margin-bottom:10px}.goalgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.goalcard{margin:0;padding:11px;min-width:0}.goalcard h3{font-size:14px;margin:0 0 5px;overflow-wrap:anywhere}.goalmeta{font-size:11px;color:var(--muted)}.goalcard .track{margin:9px 0}.goalcard .actions{margin-top:9px}.alert{padding:12px 14px;background:var(--red2);color:var(--red);border-radius:14px;font-size:13px;margin:12px 0}.good{padding:12px 14px;background:var(--green2);color:var(--green);border-radius:14px;font-size:13px;margin:12px 0}.goal-actions{display:flex;gap:7px;margin-top:10px}.goal-actions button{flex:1}
@media(max-width:390px){.goalgrid{grid-template-columns:1fr}.nav button{font-size:9px}.nav button span{font-size:17px}}
</style></head><body>
<div class="wrap"><header class="top"><div><div class="brand">Note <span>a pay</span></div><div class="sub">จัดการเงินให้ง่ายขึ้นทุกวัน ✨</div></div><button class="iconbtn" id="themeBtn" aria-label="เปลี่ยนธีม">☾</button></header><main id="app"></main></div>
<button class="fab" id="fab" aria-label="เพิ่มรายการ">＋</button>
<nav class="nav">
<button data-tab="home" class="active"><span>⌂</span>ภาพรวม</button><button data-tab="list"><span>▤</span>รายการ</button><button data-tab="savings"><span>🎯</span>ออมเงิน</button><button data-tab="debts"><span>↔</span>หนี้สิน</button><button data-tab="stats"><span>◔</span>วิเคราะห์</button><button data-tab="settings"><span>⚙</span>ตั้งค่า</button>
</nav>
<div class="modal" id="modal"><div class="sheet"><div class="sheethead"><h2 id="modalTitle">เพิ่มรายการ</h2><button class="close" id="close">✕</button></div><form id="entryForm">
<div class="field"><label>ประเภท</label><div class="seg"><button type="button" class="sel" data-kind="expense">รายจ่าย</button><button type="button" data-kind="income">รายรับ</button></div></div>
<div class="field"><label>จำนวนเงิน (บาท)</label><input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required></div>
<div class="field"><label>รายละเอียด</label><input id="note" maxlength="80" placeholder="เช่น ข้าวกลางวัน"></div>
<div class="field"><label>หมวดหมู่</label><select id="category"></select></div>
<div class="field"><label>วันที่</label><input id="date" type="date" required></div>
<div class="field"><label>แนบรูปใบเสร็จ / รูปประกอบ (ไม่บังคับ)</label><input id="entryPhoto" type="file" accept="image/*" capture="environment"><img id="entryPreview" class="photo hidden"></div>
<button class="primary" type="submit">บันทึกรายการ</button></form></div></div>
<div class="modal" id="goalModal"><div class="sheet"><div class="sheethead"><h2 id="goalModalTitle">สร้างเป้าหมายออมเงิน</h2><button class="close" id="goalClose">✕</button></div><form id="goalForm">
<div class="field"><label>ชื่อเป้าหมาย</label><input id="goalName" maxlength="60" placeholder="เช่น เก็บเงินซื้อโทรศัพท์" required></div>
<div class="field"><label>จำนวนเงินเป้าหมาย (บาท)</label><input id="goalTarget" type="number" min="1" step="1" placeholder="เช่น 15000" required></div>
<div class="field"><label>วันครบกำหนด (ไม่บังคับ)</label><input id="goalDate" type="date"></div>
<div class="field"><label>รูปเป้าหมาย (ไม่บังคับ)</label><input id="goalPhoto" type="file" accept="image/*" capture="environment"><img id="goalPreview" class="photo hidden"></div>
<button class="primary" type="submit">บันทึกเป้าหมาย</button></form></div></div>
<div class="modal" id="contribModal"><div class="sheet"><div class="sheethead"><h2>เพิ่มเงินออม</h2><button class="close" id="contribClose">✕</button></div><form id="contribForm"><div class="field"><label>จำนวนเงินที่ออม (บาท)</label><input id="contribAmount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>บันทึกเพิ่มเติม (ไม่บังคับ)</label><input id="contribNote" maxlength="80" placeholder="เช่น ออมจากเงินเดือน"></div><button class="primary" type="submit">เพิ่มเงินออม</button></form></div></div>
<div class="modal" id="debtModal"><div class="sheet"><div class="sheethead"><h2>เพิ่มรายการหนี้สิน</h2><button class="close" id="debtClose">✕</button></div><form id="debtForm"><div class="field"><label>ประเภท</label><div class="seg"><button type="button" class="sel" data-debttype="owed">คนอื่นยืมเรา</button><button type="button" data-debttype="owe">เรายืมคนอื่น</button></div></div><div class="field"><label>ชื่อคน / รายการ</label><input id="debtName" maxlength="60" placeholder="เช่น ยืมให้เพื่อน" required></div><div class="field"><label>ยอดเงิน (บาท)</label><input id="debtAmount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>วันครบกำหนด (ไม่บังคับ)</label><input id="debtDate" type="date"></div><button class="primary" type="submit">บันทึกหนี้สิน</button></form></div></div>
<script>
const $=s=>document.querySelector(s),money=n=>'฿'+Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:2});
const expenseCats=['อาหาร','เดินทาง','ช้อปปิ้ง','บิล/ค่าน้ำไฟ','สุขภาพ','บ้าน','การศึกษา','บันเทิง','อื่นๆ'],incomeCats=['เงินเดือน','งานเสริม','ลงทุน','ของขวัญ','ขายของ','อื่นๆ'];
const emojis={'อาหาร':'🍜','เดินทาง':'🚗','ช้อปปิ้ง':'🛍️','บิล/ค่าน้ำไฟ':'💡','สุขภาพ':'💊','บ้าน':'🏠','การศึกษา':'📚','บันเทิง':'🎮','อื่นๆ':'📌','เงินเดือน':'💼','งานเสริม':'💻','ลงทุน':'📈','ของขวัญ':'🎁','ขายของ':'🛒'};
let data=JSON.parse(localStorage.getItem('nap_entries')||'[]'),goals=JSON.parse(localStorage.getItem('nap_goals')||'[]'),debts=JSON.parse(localStorage.getItem('nap_debts')||'[]');
let tab='home',month=new Date().toISOString().slice(0,7),kind='expense',debtType='owed',activeGoal=null,theme=localStorage.getItem('nap_theme')||'light',budget=Number(localStorage.getItem('nap_budget')||0),entryImage='',goalImage='';
document.documentElement.dataset.theme=theme;
function save(){localStorage.setItem('nap_entries',JSON.stringify(data));localStorage.setItem('nap_goals',JSON.stringify(goals));localStorage.setItem('nap_debts',JSON.stringify(debts))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtMonth(m){let[y,mo]=m.split('-').map(Number);return new Intl.DateTimeFormat('th-TH',{month:'long',year:'numeric'}).format(new Date(y,mo-1,1))}
function shiftMonth(d){let[y,m]=month.split('-').map(Number),dt=new Date(y,m-1+d,1);month=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');render()}
function monthData(){return data.filter(x=>x.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id)}
function totals(){let a=monthData(),inc=a.filter(x=>x.kind==='income').reduce((s,x)=>s+x.amount,0),out=a.filter(x=>x.kind==='expense').reduce((s,x)=>s+x.amount,0);return{inc,out,bal:inc-out}}
function monthPicker(){return `<div class="month"><button onclick="shiftMonth(-1)">‹</button><strong>${fmtMonth(month)}</strong><button onclick="shiftMonth(1)">›</button></div>`}
function photoHTML(src,cls='thumb'){return src?`<img class="${cls}" src="${src}" alt="รูปประกอบ">`:''}
function entryHTML(x){return `<div class="item">${x.photo?photoHTML(x.photo):`<div class="bubble ${x.kind==='expense'?'out':''}">${emojis[x.cat]||'📌'}</div>`}<div class="details"><b>${esc(x.note||x.cat)}</b><small>${esc(x.cat)} · ${x.date.split('-').reverse().join('/')}${x.photo?' · มีรูปแนบ':''}</small></div><div class="amount ${x.kind==='income'?'positive':'negative'}">${x.kind==='income'?'+':'−'}${money(x.amount)}</div><button class="delete" onclick="removeEntry(${x.id})">✕</button></div>`}
function render(){let app=$('#app'),a=monthData(),t=totals(),over=budget>0&&t.out>budget;
if(tab==='home'){app.innerHTML=`${monthPicker()}<section class="hero"><div class="sub">เงินคงเหลือของเดือนนี้</div><div class="balance">${money(t.bal)}</div><div class="twos"><div class="mini"><small>↗ รายรับ</small><b>${money(t.inc)}</b></div><div class="mini"><small>↘ รายจ่าย</small><b>${money(t.out)}</b></div></div></section>${over?`<div class="alert">⚠️ ใช้จ่ายเกินงบเดือนนี้แล้ว ${money(t.out-budget)} — ลองตรวจสอบรายจ่ายกันนะ</div>`:''}<div class="sectionhead"><h2>รายการล่าสุด</h2><button class="link" onclick="setTab('list')">ดูทั้งหมด →</button></div><div class="list">${a.length?a.slice(0,6).map(entryHTML).join(''):'<div class="empty">ยังไม่มีรายการในเดือนนี้<br>กดปุ่ม ＋ เพื่อเริ่มบันทึก</div>'}</div><div class="sectionhead"><h2>เป้าหมายออมเงิน</h2><button class="link" onclick="setTab('savings')">ดูทั้งหมด →</button></div>${goals.length?`<div class="goalgrid">${goals.slice(0,2).map(goalCard).join('')}</div>`:'<div class="empty">สร้างเป้าหมายออมเงินแรกของคุณได้ที่หน้าออมเงิน 🎯</div>'}`}
if(tab==='list'){app.innerHTML=`<div class="sectionhead"><h2>รายการทั้งหมด</h2><span class="sub">${a.length} รายการ</span></div>${monthPicker()}<div class="list">${a.length?a.map(entryHTML).join(''):'<div class="empty">ยังไม่มีรายการในเดือนนี้</div>'}</div>`}
if(tab==='savings'){let totalTarget=goals.reduce((s,g)=>s+g.target,0),totalSaved=goals.reduce((s,g)=>s+g.saved,0);app.innerHTML=`<div class="sectionhead"><div><h2>ออมเงิน & เป้าหมาย 🎯</h2><div class="sub">كل هدف له طريق · ทุกเป้าหมายมีเส้นทาง</div></div><button class="secondary" onclick="openGoal()">＋ เพิ่มเป้าหมาย</button></div><div class="hero"><div class="sub">เงินออมรวมทุกเป้าหมาย</div><div class="balance">${money(totalSaved)}</div><div class="twos"><div class="mini"><small>เป้าหมายทั้งหมด</small><b>${goals.length} รายการ</b></div><div class="mini"><small>ยอดเป้าหมายรวม</small><b>${money(totalTarget)}</b></div></div></div><div class="sectionhead"><h2>เป้าหมายของฉัน</h2><span class="sub">${goals.length} เป้าหมาย</span></div>${goals.length?`<div class="goalgrid">${goals.map(goalCard).join('')}</div>`:'<div class="empty">ยังไม่มีเป้าหมายออมเงิน<br>กด ＋ เพิ่มเป้าหมายเพื่อเริ่มต้น</div>'}`}
if(tab==='debts'){let owed=debts.filter(d=>d.type==='owed'&&d.remaining>0).reduce((s,d)=>s+d.remaining,0),owe=debts.filter(d=>d.type==='owe'&&d.remaining>0).reduce((s,d)=>s+d.remaining,0);app.innerHTML=`<div class="sectionhead"><h2>หนี้สินและเงินที่ยืม ↔</h2><button class="secondary" onclick="openDebt()">＋ เพิ่ม</button></div><div class="statgrid"><div class="stat"><small>คนอื่นยืมเรา</small><b class="positive">${money(owed)}</b></div><div class="stat"><small>เรายืมคนอื่น</small><b class="negative">${money(owe)}</b></div></div><div class="sectionhead"><h2>รายการหนี้สิน</h2></div>${debts.length?`<div class="list">${debts.map(d=>`<div class="panel"><div class="barlabel"><b>${d.type==='owed'?'🟢 คนอื่นยืมเรา':'🔴 เรายืมคนอื่น'}</b><span class="goalmeta">${d.date?('ครบกำหนด '+d.date.split('-').reverse().join('/')):''}</span></div><b>${esc(d.name)}</b><div class="barlabel" style="margin-top:8px"><span>คงเหลือ ${money(d.remaining)}</span><span class="goalmeta">จาก ${money(d.amount)}</span></div><div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,(1-d.remaining/d.amount)*100))}%"></div></div><div class="goal-actions"><button class="secondary" onclick="repayDebt(${d.id})" ${d.remaining<=0?'disabled':''}>บันทึกชำระคืน</button><button class="danger" onclick="deleteDebt(${d.id})">ลบ</button></div></div>`).join('')}</div>`:'<div class="empty">ยังไม่มีรายการหนี้สิน</div>'}`}
if(tab==='stats'){let groups={};a.filter(x=>x.kind==='expense').forEach(x=>groups[x.cat]=(groups[x.cat]||0)+x.amount);let rows=Object.entries(groups).sort((x,y)=>y[1]-x[1]);let incomeByDay={},expenseByDay={};a.forEach(x=>{let day=Number(x.date.slice(-2));(x.kind==='income'?incomeByDay:expenseByDay)[day]=((x.kind==='income'?incomeByDay:expenseByDay)[day]||0)+x.amount});let maxDay=Math.max(1,...Object.values(incomeByDay),...Object.values(expenseByDay));app.innerHTML=`<div class="sectionhead"><h2>วิเคราะห์การเงิน</h2></div>${monthPicker()}<div class="statgrid"><div class="stat"><small>รายรับ</small><b class="positive">${money(t.inc)}</b></div><div class="stat"><small>รายจ่าย</small><b class="negative">${money(t.out)}</b></div><div class="stat"><small>คงเหลือ</small><b>${money(t.bal)}</b></div><div class="stat"><small>จำนวนรายการ</small><b>${a.length}</b></div></div><div class="panel"><h3>รายจ่ายแยกตามหมวดหมู่</h3>${rows.length?rows.map(([k,v])=>`<div class="barrow"><div class="barlabel"><span>${emojis[k]||'📌'} ${esc(k)}</span><b>${money(v)} · ${t.out?Math.round(v/t.out*100):0}%</b></div><div class="track"><div class="fill" style="width:${t.out?v/t.out*100:0}%"></div></div></div>`).join(''):'<div class="empty">ยังไม่มีรายจ่ายให้วิเคราะห์</div>'}</div><div class="panel"><h3>งบประมาณรายเดือน</h3><div class="barlabel"><span>ใช้ไป ${money(t.out)}</span><b>${budget?money(budget):'ยังไม่ตั้งงบ'}</b></div><div class="track"><div class="fill" style="width:${budget?Math.min(100,t.out/budget*100):0}%;background:${over?'var(--red)':'var(--green)'}"></div></div>${over?`<p class="hint negative">เกินงบ ${money(t.out-budget)}</p>`:`<p class="hint">เหลืองบ ${money(Math.max(0,budget-t.out))}</p>`}</div><div class="panel"><h3>ภาพรวมรายวัน (แท่งเปรียบเทียบ)</h3><div class="hint">รายรับสีเขียว · รายจ่ายสีแดง</div><div style="display:flex;align-items:end;gap:3px;height:100px;margin-top:14px">${Array.from({length:31},(_,i)=>{let d=i+1,iv=incomeByDay[d]||0,ev=expenseByDay[d]||0;return `<div title="${d}: รายรับ ${money(iv)} / รายจ่าย ${money(ev)}" style="flex:1;display:flex;align-items:end;gap:1px;height:100%"><div style="height:${iv/maxDay*100}%;background:var(--green);flex:1;border-radius:3px 3px 0 0"></div><div style="height:${ev/maxDay*100}%;background:var(--red);flex:1;border-radius:3px 3px 0 0"></div></div>`}).join('')}</div></div>`}
if(tab==='settings'){app.innerHTML=`<div class="sectionhead"><h2>ตั้งค่า</h2></div><div class="panel"><h3>รูปลักษณ์</h3><div class="actions"><button class="secondary" onclick="setTheme('light')">☀️ สว่าง</button><button class="secondary" onclick="setTheme('dark')">🌙 มืด</button></div></div><div class="panel"><h3>งบประมาณรายเดือน</h3><div class="field"><label>วงเงินรายจ่าย (บาท)</label><input id="budgetInput" type="number" min="0" step="1" value="${budget||''}" placeholder="เช่น 12000"></div><button class="primary" onclick="saveBudget()">บันทึกงบประมาณ</button></div><div class="panel"><h3>สำรองและกู้คืนข้อมูล</h3><p class="hint">ส่งออกไฟล์สำรองเป็นระยะ โดยไฟล์จะรวมรายการ รายการออม เป้าหมาย รูปภาพ และหนี้สิน รูปจะถูกบีบอัดก่อนเก็บไว้ในเบราว์เซอร์</p><div class="actions"><button class="secondary" onclick="exportJSON()">ส่งออกข้อมูล</button><button class="secondary" onclick="$('#importFile').click()">นำเข้าข้อมูล</button><input id="importFile" type="file" accept="application/json" class="hidden" onchange="importJSON(event)"></div><div style="height:10px"></div><button class="secondary" onclick="exportCSV()" style="width:100%">ส่งออกรายงาน CSV</button></div><div class="panel"><h3>เกี่ยวกับ Note a pay</h3><p class="hint">เวอร์ชัน 1.2 · ข้อมูลอยู่ในเบราว์เซอร์ของอุปกรณ์นี้ ไม่ได้ส่งขึ้นเซิร์ฟเวอร์หรือซิงก์ข้ามเครื่อง</p></div>`}
document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#fab').classList.toggle('hidden',!['home','list'].includes(tab))}
function goalCard(g){let pct=g.target?Math.min(100,g.saved/g.target*100):0;return `<div class="goalcard">${g.photo?`<img class="goalimg" src="${g.photo}" alt="รูปเป้าหมาย">`:`<div class="goalimg" style="display:grid;place-items:center;background:var(--green2);font-size:42px">🎯</div>`}<h3>${esc(g.name)}</h3><div class="goalmeta">${g.date?'กำหนด '+g.date.split('-').reverse().join('/'):'ไม่มีวันกำหนด'}</div><div class="barlabel" style="margin-top:8px"><b>${money(g.saved)}</b><span class="goalmeta">จาก ${money(g.target)}</span></div><div class="track"><div class="fill" style="width:${pct}%"></div></div><div class="barlabel"><span class="goalmeta">${pct.toFixed(0)}% สำเร็จ</span>${pct>=100?'<span class="positive goalmeta">สำเร็จแล้ว 🎉</span>':''}</div><div class="actions"><button class="secondary" onclick="openContrib(${g.id})">＋ ออมเพิ่ม</button><button class="danger" onclick="deleteGoal(${g.id})">ลบ</button></div></div>`}
function setTab(t){tab=t;render()}
function setTheme(t){theme=t;document.documentElement.dataset.theme=t;localStorage.setItem('nap_theme',t);$('#themeBtn').textContent=t==='dark'?'☀':'☾';render()}
function removeEntry(id){if(confirm('ลบรายการนี้ใช่ไหม?')){data=data.filter(x=>x.id!==id);save();render()}}
function setKind(k){kind=k;document.querySelectorAll('[data-kind]').forEach(b=>b.classList.toggle('sel',b.dataset.kind===k));$('#category').innerHTML=(k==='income'?incomeCats:expenseCats).map(c=>`<option>${c}</option>`).join('')}
function openEntry(){kind='expense';entryImage='';$('#entryForm').reset();$('#entryPreview').classList.add('hidden');$('#entryPreview').removeAttribute('src');$('#date').value=new Date().toISOString().slice(0,10);setKind('expense');$('#modal').classList.add('show')}
function openGoal(){goalImage='';$('#goalForm').reset();$('#goalPreview').classList.add('hidden');$('#goalPreview').removeAttribute('src');$('#goalModal').classList.add('show')}
function openContrib(id){activeGoal=id;$('#contribForm').reset();$('#contribModal').classList.add('show')}
function openDebt(){debtType='owed';$('#debtForm').reset();setDebtType('owed');$('#debtModal').classList.add('show')}
function setDebtType(t){debtType=t;document.querySelectorAll('[data-debttype]').forEach(b=>b.classList.toggle('sel',b.dataset.debttype===t))}
function deleteGoal(id){if(confirm('ลบเป้าหมายนี้ใช่ไหม?')){goals=goals.filter(g=>g.id!==id);save();render()}}
function deleteDebt(id){if(confirm('ลบรายการหนี้สินนี้ใช่ไหม?')){debts=debts.filter(d=>d.id!==id);save();render()}}
function repayDebt(id){let d=debts.find(x=>x.id===id);if(!d)return;let v=Number(prompt('กรอกยอดที่ชำระ/ได้รับคืน (บาท)',d.remaining));if(!(v>0))return;d.remaining=Math.max(0,d.remaining-v);save();render()}
function saveBudget(){budget=Math.max(0,Number($('#budgetInput').value)||0);localStorage.setItem('nap_budget',budget);render();alert('บันทึกงบประมาณแล้ว')}
function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportJSON(){download('note-a-pay-backup.json',JSON.stringify({version:2,entries:data,goals,debts,budget},null,2),'application/json')}
function exportCSV(){let rows=[['date','type','category','note','amount'],...data.map(x=>[x.date,x.kind,x.cat,x.note,x.amount])];download('note-a-pay.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv;charset=utf-8')}
function importJSON(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result);if(!Array.isArray(o.entries))throw Error();if(confirm('นำเข้าข้อมูลและแทนที่ข้อมูลปัจจุบัน?')){data=o.entries;goals=Array.isArray(o.goals)?o.goals:[];debts=Array.isArray(o.debts)?o.debts:[];budget=Number(o.budget)||0;save();localStorage.setItem('nap_budget',budget);render();alert('นำเข้าข้อมูลสำเร็จ')}}catch(_){alert('ไฟล์สำรองไม่ถูกต้อง')} };r.readAsText(f);e.target.value=''}
function compressImage(file,cb){if(!file||!file.type.startsWith('image/')){cb('');return}let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let scale=Math.min(1,850/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.68))};img.onerror=()=>cb('');img.src=reader.result};reader.readAsDataURL(file)}
$('#entryPhoto').addEventListener('change',e=>compressImage(e.target.files[0],v=>{entryImage=v;if(v){$('#entryPreview').src=v;$('#entryPreview').classList.remove('hidden')}}));
$('#goalPhoto').addEventListener('change',e=>compressImage(e.target.files[0],v=>{goalImage=v;if(v){$('#goalPreview').src=v;$('#goalPreview').classList.remove('hidden')}}));
$('#entryForm').addEventListener('submit',e=>{e.preventDefault();let amount=Number($('#amount').value),date=$('#date').value;if(!(amount>0)||!date)return;data.push({id:Date.now(),amount,note:$('#note').value.trim(),cat:$('#category').value,kind,date,photo:entryImage});save();$('#modal').classList.remove('show');render()});
$('#goalForm').addEventListener('submit',e=>{e.preventDefault();let target=Number($('#goalTarget').value);if(!(target>0))return;goals.push({id:Date.now(),name:$('#goalName').value.trim(),target,saved:0,date:$('#goalDate').value,photo:goalImage,history:[]});save();$('#goalModal').classList.remove('show');tab='savings';render()});
$('#contribForm').addEventListener('submit',e=>{e.preventDefault();let g=goals.find(x=>x.id===activeGoal),v=Number($('#contribAmount').value);if(!g||!(v>0))return;g.saved+=v;g.history=g.history||[];g.history.push({date:new Date().toISOString().slice(0,10),amount:v,note:$('#contribNote').value.trim()});save();$('#contribModal').classList.remove('show');render();if(g.saved>=g.target)alert('ยินดีด้วย! ถึงเป้าหมายออมเงินแล้ว 🎉')});
$('#debtForm').addEventListener('submit',e=>{e.preventDefault();let amount=Number($('#debtAmount').value);if(!(amount>0))return;debts.push({id:Date.now(),type:debtType,name:$('#debtName').value.trim(),amount,remaining:amount,date:$('#debtDate').value});save();$('#debtModal').classList.remove('show');tab='debts';render()});
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
document.querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('click',()=>setKind(b.dataset.kind)));
document.querySelectorAll('[data-debttype]').forEach(b=>b.addEventListener('click',()=>setDebtType(b.dataset.debttype)));
$('#fab').onclick=openEntry;$('#close').onclick=()=>$('#modal').classList.remove('show');$('#goalClose').onclick=()=>$('#goalModal').classList.remove('show');$('#contribClose').onclick=()=>$('#contribModal').classList.remove('show');$('#debtClose').onclick=()=>$('#debtModal').classList.remove('show');
['modal','goalModal','contribModal','debtModal'].forEach(id=>$('#'+id).addEventListener('click',e=>{if(e.target.id===id)$('#'+id).classList.remove('show')}));
$('#themeBtn').onclick=()=>setTheme(theme==='dark'?'light':'dark');$('#themeBtn').textContent=theme==='dark'?'☀':'☾';render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
